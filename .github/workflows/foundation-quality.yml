name: Foundation quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  foundation-quality:
    name: foundation-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record revisions and Python version
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          echo "PR head: $PR_HEAD"
          echo "PR base: $BASE_SHA"
          echo "Event revision: $EVENT_SHA"
          echo "Checked out revision: $(git rev-parse HEAD)"
          python3 --version
          python3 -c 'import sys; assert sys.version_info >= (3, 11), "Python 3.11 or newer required"'
      - name: Check roadmap
        run: python3 scripts/check_foundation.py
      - name: Check documentation
        run: python3 scripts/check_links.py
      - name: Run strict tests
        run: python3 scripts/run_foundation_tests.py
      - name: Require toolchain diagnostic tests
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_rust_toolchain.py')
          count = suite.countTestCases()
          print(f'Toolchain diagnostic tests discovered: {count}')
          if count < 8 or unittest.defaultTestLoader.errors:
              raise SystemExit('Required toolchain diagnostic tests missing or unloadable')
          PY
      - name: Provision official Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
      - name: Check Rust toolchain
        run: |
          rustup run 1.100.0 rustc --version
          rustup run 1.100.0 cargo --version
          rustup run 1.100.0 python3 scripts/check_rust_toolchain.py
      - name: Check Rust formatting
        run: rustup run 1.100.0 cargo fmt --all -- --check
      - name: Fetch locked Linux dependencies
        run: rustup run 1.100.0 cargo fetch --locked --target x86_64-unknown-linux-gnu
      - name: Check Rust core
        run: rustup run 1.100.0 cargo check -p adm-core --offline --locked
      - name: Build Rust core
        run: rustup run 1.100.0 cargo build -p adm-core --offline --locked
      - name: Require and run Rust tests
        run: |
          set -o pipefail
          rustup run 1.100.0 cargo test -p adm-core --lib --offline --locked -- tests::baseline_message_is_stable --exact | grep -Fx 'test tests::baseline_message_is_stable ... ok'
          rustup run 1.100.0 cargo test -p adm-core --offline --locked
      - name: Build release core
        run: rustup run 1.100.0 cargo build -p adm-core --release --offline --locked
      - name: Run core program
        run: |
          output=$(./target/release/adm-core)
          test "$output" = 'ADM core foundation'
          printf '%s\n' "$output"
